<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesla Probe M0</title>
<!--
  M0 capability probe for the Tesla browser (MCU1 Tegra / MCU2 Intel / MCU3 Ryzen).
  Plain ES5 on purpose: no let/const, arrows, template strings, Promises required.
  Served by tools/probe-server/probe_server.py, which also provides /ws and /results.
-->
<style>
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #111; color: #eee; font-size: 20px; }
  header { padding: 14px 20px; background: #1c1c1c; border-bottom: 1px solid #333; }
  h1 { margin: 0; font-size: 26px; }
  .sub { color: #999; font-size: 16px; margin-top: 4px; }
  main { padding: 16px 20px; }
  .btns { margin-bottom: 14px; }
  button { font-size: 22px; padding: 14px 22px; margin: 0 10px 10px 0; background: #2a6fdb; color: #fff; border: 0; border-radius: 8px; }
  button.alt { background: #3a3a3a; }
  button.ok { background: #2e8b57; }
  button.no { background: #b03a2e; }
  table { border-collapse: collapse; width: 100%; font-size: 18px; }
  td { border-bottom: 1px solid #2a2a2a; padding: 7px 8px; vertical-align: top; }
  td.k { color: #aaa; width: 40%; }
  .pass { color: #5fd38d; }
  .fail { color: #ff7b6b; }
  .warn { color: #f5c04a; }
  #status { color: #f5c04a; margin: 6px 0 12px; min-height: 24px; }
  #touch { height: 160px; background: #222; border: 2px dashed #555; border-radius: 8px; margin: 10px 0; text-align: center; line-height: 160px; color: #888; }
  #stage { margin: 10px 0; }
  canvas, video { background: #000; max-width: 100%; display: block; margin: 6px 0; }
  textarea { width: 100%; height: 160px; background: #000; color: #9f9; font-size: 14px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Tesla Probe · M0</h1>
  <div class="sub">Перевірка можливостей браузера Tesla · Tesla browser capability check</div>
</header>
<main>
  <div class="btns">
    <button id="btnAll">Запустити все · Run all</button>
    <button id="btnAudio" class="alt">Тест звуку · Audio test</button>
    <button id="btnSend" class="alt">Надіслати · Send results</button>
  </div>
  <div id="audioAsk" class="hidden">
    Чути тон? · Did you hear a tone?
    <button id="heardYes" class="ok">Так · Yes</button>
    <button id="heardNo" class="no">Ні · No</button>
  </div>
  <div id="status">Готово · Ready</div>

  <div id="touch">Торкніться тут 1–3 пальцями · Touch here with 1–3 fingers</div>

  <table id="out"></table>

  <div id="stage"></div>
  <p>JSON:</p>
  <textarea id="json" readonly></textarea>
</main>

<script>
(function () {
  'use strict';

  var R = { version: 'M0.1', time: new Date().toString(), env: {}, features: {}, media: {}, bench: {}, touch: {}, audio: {} };
  var outEl = document.getElementById('out');
  var statusEl = document.getElementById('status');
  var stage = document.getElementById('stage');

  function $(id) { return document.getElementById(id); }
  function status(t) { statusEl.innerHTML = t; }
  function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }
  function round(x, d) { var m = Math.pow(10, d || 0); return Math.round(x * m) / m; }

  function row(key, value, cls) {
    var tr = document.createElement('tr');
    var a = document.createElement('td'); a.className = 'k'; a.appendChild(document.createTextNode(key));
    var b = document.createElement('td'); if (cls) { b.className = cls; }
    b.appendChild(document.createTextNode(String(value)));
    tr.appendChild(a); tr.appendChild(b); outEl.appendChild(tr);
  }
  function yes(v) { return v ? 'yes' : 'no'; }
  function yc(v) { return v ? 'pass' : 'fail'; }
  function dump() { try { $('json').value = JSON.stringify(R, null, 2); } catch (e) { $('json').value = String(e); } }

  function tryRun(name, fn) {
    try { return fn(); } catch (e) { R.errors = R.errors || {}; R.errors[name] = String(e); row(name, 'error: ' + e, 'fail'); return null; }
  }

  // ---------- 1. Environment + features ----------
  function testEnv() {
    var env = R.env;
    env.userAgent = navigator.userAgent;
    env.screen = screen.width + 'x' + screen.height;
    env.inner = window.innerWidth + 'x' + window.innerHeight;
    env.dpr = window.devicePixelRatio || 1;
    env.cores = navigator.hardwareConcurrency || null;
    env.location = location.href;
    row('User agent', env.userAgent);
    row('Screen / viewport', env.screen + ' / ' + env.inner + ' @' + env.dpr + 'x');

    var f = R.features;
    var c = document.createElement('canvas');
    f.canvas2d = !!(c.getContext && c.getContext('2d'));
    f.webgl = !!(c.getContext && (c.getContext('webgl') || c.getContext('experimental-webgl')));
    f.webSocket = typeof WebSocket !== 'undefined';
    f.binaryArrayBuffer = false;
    f.typedArrays = typeof Uint8Array !== 'undefined';
    f.blob = typeof Blob !== 'undefined';
    f.createObjectURL = !!(window.URL && URL.createObjectURL) || !!(window.webkitURL && webkitURL.createObjectURL);
    f.createImageBitmap = typeof window.createImageBitmap === 'function';
    f.requestAnimationFrame = !!(window.requestAnimationFrame || window.webkitRequestAnimationFrame);
    f.promise = typeof Promise !== 'undefined';
    f.fetch = typeof window.fetch === 'function';
    f.worker = typeof Worker !== 'undefined';
    f.webAssembly = typeof WebAssembly !== 'undefined';
    f.touchEvents = 'ontouchstart' in window;
    f.pointerEvents = typeof window.PointerEvent !== 'undefined';
    f.es6 = (function () { try { return new Function('let a = () => 1; return `x${a()}`;')() === 'x1'; } catch (e) { return false; } })();
    f.es2017async = (function () { try { new Function('return async function(){ await 1; }'); return true; } catch (e) { return false; } })();
    f.geolocation = !!navigator.geolocation;
    f.localStorage = (function () { try { localStorage.setItem('p', '1'); localStorage.removeItem('p'); return true; } catch (e) { return false; } })();
    f.fullscreen = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
    f.wakeLock = !!(navigator.wakeLock);

    var keys = ['canvas2d', 'webgl', 'webSocket', 'typedArrays', 'blob', 'createObjectURL', 'createImageBitmap', 'requestAnimationFrame',
      'promise', 'fetch', 'worker', 'webAssembly', 'es6', 'es2017async', 'touchEvents', 'pointerEvents', 'geolocation', 'localStorage', 'fullscreen', 'wakeLock'];
    for (var i = 0; i < keys.length; i++) { row(keys[i], yes(f[keys[i]]), yc(f[keys[i]])); }
  }

  // ---------- 2. Media support ----------
  function testMedia() {
    var m = R.media;
    var MS = window.MediaSource || window.WebKitMediaSource;
    m.mediaSource = !!MS;
    m.mseTypes = {};
    var types = [
      'video/mp4; codecs="avc1.42E01F"',
      'video/mp4; codecs="avc1.4D401F"',
      'video/mp4; codecs="avc1.640028"',
      'video/mp4; codecs="hev1.1.6.L93.B0"',
      'video/mp4; codecs="hvc1.1.6.L93.B0"',
      'audio/mp4; codecs="mp4a.40.2"',
      'audio/webm; codecs="opus"'
    ];
    for (var i = 0; i < types.length; i++) {
      m.mseTypes[types[i]] = !!(MS && MS.isTypeSupported && MS.isTypeSupported(types[i]));
    }
    var v = document.createElement('video');
    var a = document.createElement('audio');
    m.canPlay = {
      'video/mp4 avc1.42E01E': v.canPlayType ? v.canPlayType('video/mp4; codecs="avc1.42E01E"') : '',
      'video/mp4 hev1': v.canPlayType ? v.canPlayType('video/mp4; codecs="hev1.1.6.L93.B0"') : '',
      'audio/ogg opus': a.canPlayType ? a.canPlayType('audio/ogg; codecs="opus"') : '',
      'audio/wav': a.canPlayType ? a.canPlayType('audio/wav') : ''
    };
    m.webCodecsVideo = typeof window.VideoDecoder !== 'undefined';
    m.webCodecsAudio = typeof window.AudioDecoder !== 'undefined';
    m.webAudio = !!(window.AudioContext || window.webkitAudioContext);
    m.scriptProcessor = m.webAudio;
    m.audioWorklet = typeof window.AudioWorkletNode !== 'undefined';
    m.getUserMedia = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

    row('MediaSource (MSE)', yes(m.mediaSource), yc(m.mediaSource));
    for (var t in m.mseTypes) { if (m.mseTypes.hasOwnProperty(t)) { row('  MSE ' + t, yes(m.mseTypes[t]), yc(m.mseTypes[t])); } }
    for (var c in m.canPlay) { if (m.canPlay.hasOwnProperty(c)) { row('canPlayType ' + c, m.canPlay[c] || '""', m.canPlay[c] ? 'pass' : 'fail'); } }
    row('WebCodecs video / audio', yes(m.webCodecsVideo) + ' / ' + yes(m.webCodecsAudio), yc(m.webCodecsVideo));
    row('Web Audio', yes(m.webAudio), yc(m.webAudio));
    row('AudioWorklet', yes(m.audioWorklet), yc(m.audioWorklet));
    row('getUserMedia (mic)', yes(m.getUserMedia), yc(m.getUserMedia));
  }

  // ---------- 3. Canvas benchmark ----------
  function testCanvas(done) {
    var w = 1024, h = 576;
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var ctx = c.getContext('2d');
    if (!ctx) { row('Canvas bench', 'no 2d context', 'fail'); return done(); }
    var img = ctx.createImageData(w, h);
    var d = img.data;
    var n = 30, t0 = now();
    for (var k = 0; k < n; k++) {
      for (var i = 0; i < d.length; i += 4) { d[i] = (i + k * 7) & 255; d[i + 1] = k * 3 & 255; d[i + 2] = 128; d[i + 3] = 255; }
      ctx.putImageData(img, 0, 0);
    }
    var ms = (now() - t0) / n;
    R.bench.canvasPutImageData1024x576_ms = round(ms, 1);
    row('Canvas fill+putImageData 1024×576', round(ms, 1) + ' ms/frame (' + round(1000 / ms, 1) + ' fps max)', ms < 50 ? 'pass' : 'warn');
    done();
  }

  // ---------- 4. WebSocket tests ----------
  var ws = null;
  function wsUrl() { return (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws'; }

  function openWs(cb) {
    if (!R.features.webSocket) { row('WebSocket', 'not available', 'fail'); return cb(false); }
    try { ws = new WebSocket(wsUrl()); } catch (e) { row('WebSocket', 'error ' + e, 'fail'); return cb(false); }
    try { ws.binaryType = 'arraybuffer'; R.features.binaryArrayBuffer = ws.binaryType === 'arraybuffer'; } catch (e2) { R.features.binaryArrayBuffer = false; }
    var timer = setTimeout(function () { row('WebSocket connect', 'timeout', 'fail'); cb(false); }, 5000);
    ws.onopen = function () { clearTimeout(timer); row('WebSocket connect', 'ok, binaryType arraybuffer: ' + yes(R.features.binaryArrayBuffer), 'pass'); cb(true); };
    ws.onerror = function () { clearTimeout(timer); row('WebSocket connect', 'error (server running?)', 'fail'); cb(false); };
  }

  function testPing(done) {
    var times = [], i = 0, total = 20;
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string' && ev.data.indexOf('pong:') === 0) {
        times.push(now() - parseFloat(ev.data.substr(5)));
        i++;
        if (i < total) { send(); } else { finish(); }
      }
    };
    function send() { ws.send('ping:' + now()); }
    function finish() {
      var sum = 0, max = 0;
      for (var k = 0; k < times.length; k++) { sum += times[k]; if (times[k] > max) { max = times[k]; } }
      var avg = sum / times.length;
      R.bench.wsRttAvg_ms = round(avg, 1); R.bench.wsRttMax_ms = round(max, 1);
      row('WebSocket round trip', 'avg ' + round(avg, 1) + ' ms, max ' + round(max, 1) + ' ms', avg < 30 ? 'pass' : 'warn');
      done();
    }
    send();
  }

  function testBulk(done) {
    var total = 4 * 1024 * 1024, chunk = 65536, got = 0, t0 = now();
    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') {
        if (ev.data === 'bulk-done') {
          var sec = (now() - t0) / 1000;
          var mbps = got * 8 / sec / 1e6;
          R.bench.wsThroughput_Mbit = round(mbps, 1);
          row('WebSocket download 4 MB', round(mbps, 1) + ' Mbit/s (' + round(sec, 2) + ' s)', mbps > 20 ? 'pass' : 'warn');
          done();
        }
        return;
      }
      got += ev.data.byteLength || ev.data.size || 0;
    };
    ws.send('bulk:' + total + ':' + chunk);
  }

  // JPEG pipeline: request frame -> receive -> decode -> draw -> request next.
  function testJpeg(size, w, h, done) {
    var frames = 0, maxFrames = 60, t0 = 0, decodeSum = 0;
    var c = document.createElement('canvas'); c.width = w; c.height = h; c.style.width = '480px';
    stage.innerHTML = ''; stage.appendChild(c);
    var ctx = c.getContext('2d');
    var URLx = window.URL || window.webkitURL;
    var useBitmap = R.features.createImageBitmap;

    ws.onmessage = function (ev) {
      if (typeof ev.data === 'string') { return; }
      var td = now();
      var blob;
      try { blob = new Blob([ev.data], { type: 'image/jpeg' }); } catch (e) { row('JPEG ' + size, 'Blob failed: ' + e, 'fail'); return done(); }
      if (useBitmap) {
        createImageBitmap(blob).then(function (bmp) { ctx.drawImage(bmp, 0, 0); if (bmp.close) { bmp.close(); } next(td); }, function () { useBitmap = false; next(td); });
      } else {
        var img = new Image();
        var url = URLx.createObjectURL(blob);
        img.onload = function () { ctx.drawImage(img, 0, 0); URLx.revokeObjectURL(url); next(td); };
        img.onerror = function () { URLx.revokeObjectURL(url); row('JPEG ' + size, 'decode failed', 'fail'); done(); };
        img.src = url;
      }
    };
    function next(td) {
      decodeSum += now() - td;
      frames++;
      if (frames === 1) { t0 = now(); }
      if (frames < maxFrames) { ws.send('jpeg:' + size); } else { finish(); }
    }
    function finish() {
      var sec = (now() - t0) / 1000;
      var fps = (frames - 1) / sec;
      var dec = decodeSum / frames;
      R.bench['jpeg' + w + 'x' + h + '_fps'] = round(fps, 1);
      R.bench['jpeg' + w + 'x' + h + '_decodeDraw_ms'] = round(dec, 1);
      R.bench.jpegDecoder = useBitmap ? 'createImageBitmap' : 'Image+blobURL';
      row('JPEG stream ' + w + '×' + h, round(fps, 1) + ' fps, decode+draw ' + round(dec, 1) + ' ms (' + R.bench.jpegDecoder + ')', fps >= 15 ? 'pass' : (fps >= 8 ? 'warn' : 'fail'));
      done();
    }
    ws.send('jpeg:' + size);
  }

  // ---------- 5. MSE playback ----------
  function testMse(file, codec, label, done) {
    var MS = window.MediaSource || window.WebKitMediaSource;
    if (!MS || !MS.isTypeSupported || !MS.isTypeSupported('video/mp4; codecs="' + codec + '"')) {
      row('MSE play ' + label, 'skipped (type not supported)', 'fail');
      R.bench['mse_' + label] = 'unsupported';
      return done();
    }
    var v = document.createElement('video');
    v.muted = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.width = 480;
    stage.innerHTML = ''; stage.appendChild(v);
    var ms = new MS();
    var URLx = window.URL || window.webkitURL;
    v.src = URLx.createObjectURL(ms);
    var finished = false;
    var guard = setTimeout(function () { end('timeout'); }, 15000);

    function end(err) {
      if (finished) { return; }
      finished = true; clearTimeout(guard);
      var q = v.getVideoPlaybackQuality ? v.getVideoPlaybackQuality() : null;
      var decoded = q ? q.totalVideoFrames : (v.webkitDecodedFrameCount || 0);
      var dropped = q ? q.droppedVideoFrames : (v.webkitDroppedFrameCount || 0);
      var played = v.currentTime || 0;
      var fps = played > 0 ? decoded / played : 0;
      R.bench['mse_' + label] = { error: err || null, played_s: round(played, 2), decoded: decoded, dropped: dropped, fps: round(fps, 1) };
      row('MSE play ' + label, err ? ('fail: ' + err) : (round(fps, 1) + ' fps, dropped ' + dropped + ', played ' + round(played, 1) + ' s'), err ? 'fail' : (fps >= 25 && dropped < 15 ? 'pass' : 'warn'));
      try { v.pause(); } catch (e) {}
      done();
    }

    ms.addEventListener('sourceopen', function () {
      var sb;
      try { sb = ms.addSourceBuffer('video/mp4; codecs="' + codec + '"'); } catch (e) { return end('addSourceBuffer ' + e); }
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'assets/' + file, true);
      xhr.responseType = 'arraybuffer';
      xhr.onload = function () {
        if (xhr.status !== 200) { return end('http ' + xhr.status); }
        sb.addEventListener('updateend', function () {
          try { if (ms.readyState === 'open') { ms.endOfStream(); } } catch (e) {}
          var p = v.play();
          if (p && p.then) { p.then(null, function (e) { end('play() ' + e); }); }
          setTimeout(function () { end(null); }, 4500);
        });
        try { sb.appendBuffer(xhr.response); } catch (e) { end('appendBuffer ' + e); }
      };
      xhr.onerror = function () { end('xhr error'); };
      xhr.send();
    });
  }

  // ---------- 6. Audio (needs a tap) ----------
  function testAudio() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { R.audio.webAudio = false; row('Audio tone', 'no Web Audio', 'fail'); dump(); return; }
    try {
      var ctx = new AC();
      R.audio.sampleRate = ctx.sampleRate;
      var sr = ctx.sampleRate, len = sr; // 1 s of PCM, the same path the stream will use
      var buf = ctx.createBuffer(2, len, sr);
      for (var ch = 0; ch < 2; ch++) {
        var data = buf.getChannelData(ch);
        for (var i = 0; i < len; i++) { data[i] = 0.25 * Math.sin(2 * Math.PI * 440 * i / sr); }
      }
      var src = ctx.createBufferSource();
      src.buffer = buf; src.connect(ctx.destination);
      if (ctx.resume) { ctx.resume(); }
      if (src.start) { src.start(0); } else { src.noteOn(0); }
      R.audio.state = ctx.state || 'n/a';
      row('Audio tone (PCM buffer)', 'played at ' + sr + ' Hz, state ' + R.audio.state, 'warn');
      $('audioAsk').className = '';
    } catch (e) {
      R.audio.error = String(e);
      row('Audio tone', 'error ' + e, 'fail');
    }
    dump();
  }
  $('heardYes').onclick = function () { R.audio.heard = true; $('audioAsk').className = 'hidden'; row('Audio heard', 'yes', 'pass'); dump(); };
  $('heardNo').onclick = function () { R.audio.heard = false; $('audioAsk').className = 'hidden'; row('Audio heard', 'no', 'fail'); dump(); };

  // ---------- 7. Touch ----------
  (function setupTouch() {
    var el = $('touch');
    R.touch = { touchstart: 0, pointerdown: 0, mousedown: 0, maxTouches: 0 };
    function label() { el.innerHTML = 'touch ' + R.touch.touchstart + ' · pointer ' + R.touch.pointerdown + ' · mouse ' + R.touch.mousedown + ' · max fingers ' + R.touch.maxTouches; dump(); }
    if (el.addEventListener) {
      el.addEventListener('touchstart', function (e) { R.touch.touchstart++; if (e.touches && e.touches.length > R.touch.maxTouches) { R.touch.maxTouches = e.touches.length; } label(); e.preventDefault(); }, false);
      el.addEventListener('pointerdown', function () { R.touch.pointerdown++; label(); }, false);
      el.addEventListener('mousedown', function () { R.touch.mousedown++; label(); }, false);
    }
  })();

  // ---------- runner ----------
  function series(steps, done) {
    var i = 0;
    function next() {
      if (i >= steps.length) { return done(); }
      var s = steps[i++];
      status('… ' + s[0]);
      try { s[1](function () { dump(); setTimeout(next, 50); }); } catch (e) { row(s[0], 'error ' + e, 'fail'); setTimeout(next, 50); }
    }
    next();
  }

  function runAll() {
    outEl.innerHTML = '';
    tryRun('env', testEnv);
    tryRun('media', testMedia);
    dump();
    series([
      ['Canvas', testCanvas],
      ['WebSocket', function (cb) { openWs(function (ok) { R.bench.wsOk = ok; cb(); }); }],
      ['WS ping', function (cb) { if (!R.bench.wsOk) { return cb(); } testPing(cb); }],
      ['WS throughput', function (cb) { if (!R.bench.wsOk) { return cb(); } testBulk(cb); }],
      ['JPEG 800×480', function (cb) { if (!R.bench.wsOk) { return cb(); } testJpeg('800', 800, 480, cb); }],
      ['JPEG 1280×720', function (cb) { if (!R.bench.wsOk) { return cb(); } testJpeg('1280', 1280, 720, cb); }],
      ['MSE baseline 576p', function (cb) { testMse('h264-baseline-576p30.mp4', 'avc1.42E01F', 'baseline576p', cb); }],
      ['MSE main 720p', function (cb) { testMse('h264-main-720p30.mp4', 'avc1.4D401F', 'main720p', cb); }]
    ], function () {
      stage.innerHTML = '';
      status('Готово. Натисніть «Тест звуку», торкніться поля, потім «Надіслати». · Done. Run the audio test, touch the box, then Send.');
      dump();
    });
  }

  function sendResults() {
    dump();
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '/results', true);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onload = function () { status(xhr.status === 200 ? 'Надіслано · Sent ✓' : 'Помилка · Error ' + xhr.status); };
    xhr.onerror = function () { status('Не вдалося надіслати — скопіюйте JSON · Send failed, copy the JSON'); };
    xhr.send($('json').value);
  }

  $('btnAll').onclick = runAll;
  $('btnAudio').onclick = testAudio;
  $('btnSend').onclick = sendResults;

  tryRun('env', testEnv);
  tryRun('media', testMedia);
  dump();
})();
</script>
</body>
</html>
