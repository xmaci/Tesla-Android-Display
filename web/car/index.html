<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TeslaDroid</title>
<!--
  M1a car client. Plain ES5 for the MCU1 browser (QtCarBrowser / WebKit 601).
  Up to N frames in flight (window). Frames are decoded one at a time; if newer ones are
  already waiting, older ones are skipped (acked as not shown) so the car always shows the newest.
-->
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #bar { height: 64px; display: flex; align-items: center; background: #161616; border-bottom: 1px solid #2a2a2a; padding: 0 8px; }
  #bar button { font-size: 22px; min-width: 64px; height: 52px; margin-right: 8px; background: #2b2b2b; color: #eee; border: 0; border-radius: 8px; }
  #bar button.opt { min-width: 86px; font-size: 20px; background: #20324f; }
  #stats { flex: 1; text-align: right; font-size: 15px; line-height: 19px; color: #9a9a9a; white-space: nowrap; overflow: hidden; }
  #wrap { position: absolute; top: 65px; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #screen { background: #050505; display: block; }
  .shot { position: absolute; display: none; }
  #msg { position: absolute; top: 45%; left: 0; right: 0; text-align: center; font-size: 26px; color: #888; }
  .dot { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 18px; background: rgba(42,111,219,0.6); pointer-events: none; }
</style>
</head>
<body>
<div id="bar">
  <button id="kBack">◀</button>
  <button id="kHome">●</button>
  <button id="kRecents">▢</button>
  <button id="kNotif">☰</button>
  <button id="bW" class="opt">432px</button>
  <button id="bQ" class="opt">q50</button>
  <button id="bN" class="opt">×2</button>
  <button id="bF" class="opt">fit</button>
  <div id="stats">…</div>
</div>
<div id="wrap"><canvas id="screen" width="432" height="960"></canvas><img id="shotA" class="shot"><img id="shotB" class="shot"></div>
<div id="msg">Підключення… · Connecting…</div>

<script>
(function () {
  'use strict';

  var canvas = document.getElementById('screen');
  var ctx = canvas.getContext('2d');
  var wrap = document.getElementById('wrap');
  var msg = document.getElementById('msg');
  var statsEl = document.getElementById('stats');
  var URLx = window.URL || window.webkitURL;
  var ws = null, retry = null;
  var frames = 0, lastFpsT = now(), localFps = 0, lastDecode = 0;
  var server = {};

  function now() { return (window.performance && performance.now) ? performance.now() : new Date().getTime(); }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } }

  // Width / quality: tap to cycle (MCU1 cannot open <select> menus).
  // The URL can also set them: /?w=320&q=35
  var WIDTHS = ['240', '320', '432', '540', '720'], QUALS = ['25', '35', '50', '65'], WINS = ['1', '2', '3'];
  function param(name) {
    var m = new RegExp('[?&]' + name + '=([a-z0-9:]+)').exec(location.search);
    return m ? m[1] : null;
  }
  var curW = param('w') || load('td_w', '432');
  var curQ = param('q') || load('td_q', '50');
  var curN = param('n') || load('td_n', '2');
  // Scale mode: 'draw' = canvas has the on-screen size and drawImage scales (no CSS stretch),
  // 'fit' = CSS stretches a frame-sized canvas (slow on MCU1), '1:1' = no scaling at all.
  // 'img' = no canvas: two <img> elements, browser decodes and scales natively.
  var MODES = ['draw', 'fit', '1:1', 'img'];
  var shots = [document.getElementById('shotA'), document.getElementById('shotB')], front = 0;
  var shotUrls = [null, null];
  var mode = param('mode') || load('td_mode', 'draw');
  if (MODES.indexOf(mode) < 0) { mode = 'draw'; }
  var frameW = 0, frameH = 0;
  var bW = document.getElementById('bW'), bQ = document.getElementById('bQ');
  var bN = document.getElementById('bN'), bF = document.getElementById('bF');
  function labels() { bW.innerHTML = curW + 'px'; bQ.innerHTML = 'q' + curQ; bN.innerHTML = '×' + curN; bF.innerHTML = mode; }
  function next(list, v) { var i = list.indexOf(v); return list[(i + 1) % list.length]; }
  function sendCfg() { if (ws && ws.readyState === 1) { ws.send('cfg:' + curW + ':' + curQ + ':' + curN); } }
  var cycleW = function () { curW = next(WIDTHS, curW); store('td_w', curW); labels(); sendCfg(); };
  var cycleQ = function () { curQ = next(QUALS, curQ); store('td_q', curQ); labels(); sendCfg(); };
  var cycleN = function () { curN = next(WINS, curN); store('td_n', curN); labels(); sendCfg(); };
  var cycleF = function () { mode = next(MODES, mode); store('td_mode', mode); labels(); setTimeout(fit, 0); };
  labels();

  // ---- layout: fit the frame into the area below the bar, keep aspect ----
  function fit() {
    var aw = wrap.clientWidth, ah = wrap.clientHeight;
    var fw = frameW || canvas.width, fh = frameH || canvas.height;
    var sc = Math.min(aw / fw, ah / fh);
    var cw, ch;
    if (mode === '1:1') { cw = fw; ch = fh; }
    else { cw = Math.floor(fw * sc); ch = Math.floor(fh * sc); }
    if (mode === 'fit') {
      if (canvas.width !== fw || canvas.height !== fh) { canvas.width = fw; canvas.height = fh; }
    } else if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
    canvas.style.width = cw + 'px';
    canvas.style.height = ch + 'px';
    var useImg = mode === 'img';
    canvas.style.display = useImg ? 'none' : 'block';
    for (var i = 0; i < 2; i++) {
      var sh = shots[i];
      sh.style.width = Math.floor(fw * sc) + 'px';
      sh.style.height = Math.floor(fh * sc) + 'px';
      sh.style.left = Math.floor((aw - fw * sc) / 2) + 'px';
      sh.style.top = Math.floor((ah - fh * sc) / 2) + 'px';
      if (!useImg) { sh.style.display = 'none'; }
    }
  }
  window.onresize = fit;
  fit();

  // ---- connection ----
  function connect() {
    retry = null;
    try { ws = new WebSocket('ws://' + location.host + '/ws'); } catch (e) { schedule(); return; }
    ws.binaryType = 'arraybuffer';
    ws.onopen = function () { queue = []; busy = false; msg.style.display = 'none'; sendCfg(); };
    ws.onclose = function () { msg.style.display = 'block'; msg.innerHTML = 'Немає зв’язку з телефоном · Phone disconnected'; schedule(); };
    ws.onerror = function () {};
    ws.onmessage = onMessage;
  }
  function schedule() { if (!retry) { retry = setTimeout(connect, 1500); } }

  // ---- frames: decode one at a time, always the newest ----
  var queue = [], busy = false, lastDraw = 0, lastWait = 0;
  function onMessage(ev) {
    if (typeof ev.data === 'string') {
      if (ev.data.indexOf('s:') === 0) { try { server = JSON.parse(ev.data.substr(2)); } catch (e) {} showStats(); }
      return;
    }
    queue.push({ buf: ev.data, t: now() });
    pump();
  }
  function seqOf(buf) { return new DataView(buf).getUint32(0); }
  function pump() {
    if (busy || !queue.length) { return; }
    while (queue.length > 1) { ack(seqOf(queue.shift().buf), 0, 0, 0, 0); }   // stale: skipped
    var f = queue.shift();
    busy = true;
    var buf = f.buf, dv = new DataView(buf);
    var seq = dv.getUint32(0), w = dv.getUint16(4), h = dv.getUint16(6);
    var t0 = now(), wait = Math.round(t0 - f.t);
    var url = URLx.createObjectURL(new Blob([buf.slice(12)], { type: 'image/jpeg' }));
    if (mode === 'img') { showImg(seq, w, h, url, t0, wait); return; }
    var img = new Image();
    img.onload = function () {
      var t1 = now();
      if (frameW !== w || frameH !== h) { frameW = w; frameH = h; fit(); }
      if (mode === 'draw') { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); }
      else { ctx.drawImage(img, 0, 0); }
      var t2 = now();
      URLx.revokeObjectURL(url);
      lastDecode = Math.round(t1 - t0); lastDraw = Math.round(t2 - t1); lastWait = wait;
      ack(seq, lastDecode, lastDraw, wait, 1);
      frames++;
      busy = false; pump();
    };
    img.onerror = function () { URLx.revokeObjectURL(url); ack(seq, 0, 0, 0, 0); busy = false; pump(); };
    img.src = url;
  }
  // <img> path: load into the hidden element, then swap. "dec" = load time, "draw" = swap time.
  function showImg(seq, w, h, url, t0, wait) {
    var back = 1 - front, el = shots[back];
    el.onload = function () {
      var t1 = now();
      if (frameW !== w || frameH !== h) { frameW = w; frameH = h; fit(); }
      el.style.display = 'block';
      shots[front].style.display = 'none';
      if (shotUrls[front]) { URLx.revokeObjectURL(shotUrls[front]); }
      shotUrls[back] = url;
      front = back;
      var t2 = now();
      lastDecode = Math.round(t1 - t0); lastDraw = Math.round(t2 - t1); lastWait = wait;
      ack(seq, lastDecode, lastDraw, wait, 1);
      frames++;
      busy = false; pump();
    };
    el.onerror = function () { URLx.revokeObjectURL(url); ack(seq, 0, 0, 0, 0); busy = false; pump(); };
    el.src = url;
  }

  function ack(seq, dec, draw, wait, shown) {
    if (ws && ws.readyState === 1) { ws.send('ack:' + seq + ':' + dec + ':' + draw + ':' + wait + ':' + shown); }
  }

  function showStats() {
    var t = now();
    if (t - lastFpsT >= 1000) { localFps = frames * 1000 / (t - lastFpsT); frames = 0; lastFpsT = t; }
    statsEl.innerHTML = (Math.round(localFps * 10) / 10) + ' fps · ' + (server.lat || 0) + ' ms · ' +
      (server.kb || 0) + ' KB · ' + (server.w || canvas.width) + '×' + (server.h || canvas.height) +
      (server.touch ? '' : ' · touch off') + '<br>' +
      'enc ' + (server.enc || 0) + ' · net ' + (server.net || 0) + ' · wait ' + (server.wait || 0) +
      ' · dec ' + (server.dec || 0) + ' · draw ' + (server.draw || 0) + ' ms';
  }

  // ---- touch: normalised 0..1 coordinates, moves throttled to ~20/s ----
  // Listen on the whole picture area (#wrap) and map to whichever element shows the frame
  // (canvas, or the front <img> in 'img' mode — the canvas is hidden there).
  var lastMove = 0, lastTouchT = 0, touching = false;
  function picture() { return mode === 'img' ? shots[front] : canvas; }
  function pos(clientX, clientY) {
    var r = picture().getBoundingClientRect();
    if (!r.width || !r.height) { return null; }
    var x = (clientX - r.left) / r.width, y = (clientY - r.top) / r.height;
    return { x: Math.max(0, Math.min(1, x)), y: Math.max(0, Math.min(1, y)), cx: clientX, cy: clientY,
      inside: x >= 0 && x <= 1 && y >= 0 && y <= 1 };
  }
  function sendTouch(kind, p) {
    if (p && ws && ws.readyState === 1) { ws.send('t:' + kind + ':' + p.x.toFixed(4) + ':' + p.y.toFixed(4)); }
  }
  function dot(p) {
    var d = document.createElement('div'); d.className = 'dot';
    d.style.left = p.cx + 'px'; d.style.top = p.cy + 'px';
    document.body.appendChild(d);
    setTimeout(function () { if (d.parentNode) { d.parentNode.removeChild(d); } }, 350);
  }
  wrap.addEventListener('touchstart', function (e) {
    lastTouchT = now();
    var t = e.changedTouches[0], p = pos(t.clientX, t.clientY);
    e.preventDefault();
    if (!p || !p.inside) { return; }          // tap on the black border: ignore
    touching = true; sendTouch('d', p); dot(p);
  }, false);
  wrap.addEventListener('touchmove', function (e) {
    lastTouchT = now();
    e.preventDefault();
    if (!touching) { return; }
    var t = e.changedTouches[0], n = now();
    if (n - lastMove > 50) { lastMove = n; sendTouch('m', pos(t.clientX, t.clientY)); }
  }, false);
  function touchEnd(e) {
    lastTouchT = now();
    e.preventDefault();
    if (!touching) { return; }
    touching = false;
    var t = e.changedTouches[0];
    sendTouch('u', pos(t.clientX, t.clientY));
  }
  wrap.addEventListener('touchend', touchEnd, false);
  wrap.addEventListener('touchcancel', touchEnd, false);
  // Mouse fallback (desktop testing). Ignored right after a touch: old WebKit also
  // fires emulated mouse events for every tap.
  var mouseDown = false;
  function fromTouch() { return now() - lastTouchT < 800; }
  wrap.addEventListener('mousedown', function (e) {
    if (fromTouch()) { return; }
    var p = pos(e.clientX, e.clientY);
    if (!p || !p.inside) { return; }
    mouseDown = true; sendTouch('d', p); dot(p);
  }, false);
  wrap.addEventListener('mousemove', function (e) {
    if (!mouseDown || fromTouch()) { return; }
    var n = now(); if (n - lastMove > 50) { lastMove = n; sendTouch('m', pos(e.clientX, e.clientY)); }
  }, false);
  window.addEventListener('mouseup', function (e) {
    if (!mouseDown) { return; } mouseDown = false; sendTouch('u', pos(e.clientX, e.clientY));
  }, false);

  // ---- bar buttons: one action per tap. MCU1 fires touch + emulated click for one tap,
  // so act on touchend and swallow the click that follows; plain click still works on desktop.
  function onTap(el, fn) {
    // pendingTouch: a touch on this button already acted; the emulated click that MCU1 sends
    // afterwards can arrive much later (e.g. after a heavy re-layout), so swallow the next click
    // whenever it comes, regardless of timing. Cleared after 3 s in case no click follows.
    var pendingTouch = false, clearT = null;
    el.addEventListener('touchend', function (e) {
      e.preventDefault();
      pendingTouch = true;
      if (clearT) { clearTimeout(clearT); }
      clearT = setTimeout(function () { pendingTouch = false; }, 3000);
      fn();
    }, false);
    el.addEventListener('click', function (e) {
      e.preventDefault();
      if (pendingTouch) { pendingTouch = false; return; }
      fn();
    }, false);
  }
  function key(name) { return function () { if (ws && ws.readyState === 1) { ws.send('k:' + name); } }; }
  onTap(document.getElementById('kBack'), key('back'));
  onTap(document.getElementById('kHome'), key('home'));
  onTap(document.getElementById('kRecents'), key('recents'));
  onTap(document.getElementById('kNotif'), key('notifications'));

  onTap(bW, cycleW); onTap(bQ, cycleQ); onTap(bN, cycleN); onTap(bF, cycleF);

  setInterval(showStats, 1000);
  connect();
})();
</script>
</body>
</html>
